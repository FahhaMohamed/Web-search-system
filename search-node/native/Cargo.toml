[package]
name = "native_text_index"
version = "0.1.0"
edition = "2021"
description = "Native Rust text index (Tantivy) exposed to Node via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
tantivy = "0.22"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
opt-level = 3
