version: '3.8'

services:
  schema-registry:
    build: ./schema-registry
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - search-network
    volumes:
      - ./data:/data

  specialty-node:
    build: ./specialty-node
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
    depends_on:
      - schema-registry
    networks:
      - search-network

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
    depends_on:
      - schema-registry
      - search-node-1
      - search-node-2
      - search-node-3
      - index-node-1
      - index-node-2
    networks:
      - search-network
    volumes:
      - ./data:/data

  search-node-1:
    build: ./search-node
    ports:
      - "3001:3001"
    environment:
      - NODE_ID=node1
      - NODE_SPECIALTY=text
      - PORT=3001
    networks:
      - search-network
    volumes:
      - ./data:/data

  search-node-2:
    build: ./search-node
    ports:
      - "3002:3002"
    environment:
      - NODE_ID=node2
      - NODE_SPECIALTY=metadata
      - PORT=3002
    networks:
      - search-network
    volumes:
      - ./data:/data

  search-node-3:
    build: ./search-node
    ports:
      - "3003:3003"
    environment:
      - NODE_ID=node3
      - NODE_SPECIALTY=tags
      - PORT=3003
    networks:
      - search-network
    volumes:
      - ./data:/data

  index-node-1:
    build: ./index-node
    ports:
      - "4001:4001"
    environment:
      - NODE_ID=index1
      - PORT=4001
    networks:
      - search-network
    volumes:
      - ./data:/data

  index-node-2:
    build: ./index-node
    ports:
      - "4002:4002"
    environment:
      - NODE_ID=index2
      - PORT=4002
    networks:
      - search-network
    volumes:
      - ./data:/data

  monitoring:
    build: ./monitoring
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_URL=http://gateway:3000
    depends_on:
      - gateway
    networks:
      - search-network

networks:
  search-network:
    driver: bridge

volumes:
  search-data: