services:
  schema-registry:
    build: ./schema-registry
    container_name: schema-registry
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - search-network
    volumes:
      - ./data:/data

  specialty-node:
    build: ./specialty-node
    container_name: specialty-node
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
    depends_on:
      - schema-registry
    networks:
      - search-network

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
      - SPECIALTY_NODE_URL=http://specialty-node:6000
      - INDEX_NODE_URL=http://index-node:4001
      - SHARD_CLUSTER_URL=http://shard-cluster:7000
      - TEXT_NODE_URL=http://text-node:3001
      - METADATA_NODE_URL=http://metadata-node:3002
      - TAGS_NODE_URL=http://tags-node:3003
    depends_on:
      - schema-registry
      - specialty-node
      - text-node
      - metadata-node
      - tags-node
      - index-node
      - shard-cluster
    networks:
      - search-network
    volumes:
      - ./data:/data

  text-node:
    build: ./search-node
    container_name: text-node
    ports:
      - "3001:3001"
    environment:
      - NODE_ID=text-node
      - NODE_SPECIALTY=text
      - PORT=3001
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
      - TEXT_ALGORITHM=${TEXT_ALGORITHM:-inverted}
      - NODE_OPTIONS=--max-old-space-size=4096
    restart: unless-stopped
    networks:
      - search-network
    volumes:
      - ./data:/data

  metadata-node:
    build: ./search-node
    container_name: metadata-node
    ports:
      - "3002:3002"
    environment:
      - NODE_ID=metadata-node
      - NODE_SPECIALTY=metadata
      - PORT=3002
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
    networks:
      - search-network
    volumes:
      - ./data:/data

  tags-node:
    build: ./search-node
    container_name: tags-node
    ports:
      - "3003:3003"
    environment:
      - NODE_ID=tags-node
      - NODE_SPECIALTY=tags
      - PORT=3003
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
    networks:
      - search-network
    volumes:
      - ./data:/data

  index-node:
    build: ./index-node
    container_name: index-node
    ports:
      - "4001:4001"
    environment:
      - NODE_ID=index-node
      - PORT=4001
      - SCHEMA_REGISTRY_URL=http://schema-registry:5000
      - SHARD_CLUSTER_URL=http://shard-cluster:7000
      - TEXT_NODE_URL=http://text-node:3001
      - METADATA_NODE_URL=http://metadata-node:3002
      - TAGS_NODE_URL=http://tags-node:3003
    depends_on:
      - schema-registry
      - shard-cluster
      - text-node
      - metadata-node
      - tags-node
    networks:
      - search-network

  shard-cluster:
    build: ./shard-cluster
    container_name: shard-cluster
    ports:
      - "7000:7000"
    environment:
      - NODE_ID=shard-cluster
      - PORT=7000
      - SHARD_COUNT=4
      - DATA_DIR=/data/shards
    networks:
      - search-network
    volumes:
      - ./data:/data

  monitoring:
    build: ./monitoring
    container_name: monitoring
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_URL=http://gateway:3000
    depends_on:
      - gateway
    networks:
      - search-network

networks:
  search-network:
    driver: bridge

volumes:
  search-data:
